# E3, unequal head dimensions (table): n = 32768, d1 = 16384 (Q, K), d2 = 4096 (V). Loop 1 is in its 3D regime for
# P >= n^2/d1^2 = 4, loop 2 for P >= n^2/d2^2 = 64, so P = 4 / 16 / 128 is 2D/2D, mixed, 3D/3D.
# TODO: add the mixed 2D+3D algorithm once implemented.
name = "e3_unequal"
jobs = 2
shuffle = true

[defaults]
n = 32768
d = 16384
d2 = 4096
warmup = 5
reps = 20
max_reps = 100

[[run]]
alg = ["2d", "3d"]
P = [4, 16, 128]
