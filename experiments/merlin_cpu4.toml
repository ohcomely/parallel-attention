# Merlin7 CPU, fourth round. Same runs as merlin_cpu3 (without its grid sweep: the words-optimal grid was fastest
# or tied everywhere), with:
#  * binding: --cpu-bind=threads instead of cores. With cores, each rank's mask held both hyper-threads of its
#    8 cores (cpus_per_rank = 16), so BLAS threads could share a core; single ranks' GEMMs ran up to 1.8x slower.
#    Expect cpus_per_rank = 8 in results.csv.
#  * OMP_WAIT_POLICY=passive, and (in the code) softmax kernels stay on one thread below 2^18 entries, so OpenMP
#    and OpenBLAS threads stop competing for cores (round 3: 2D comm +7-15%, Ring compute +22-39%).
#  * unequal Split pipeline blocks (--blocks) next to the uniform ones at P = 64 / 128: small first and last blocks
#    shorten the pipeline fill (consumer waits for block 0) and drain (producers idle during the last block).
#    Weights sum to 8 or 16, so every block divides the grids: 1,3,3,1 (T = 4), 1,2,2,2,1 (T = 5),
#    1,2,2,2,2,2,2,2,1 (T = 9, middle blocks as T = 8).
# Submit (each allocation ~12-15 min on 8 nodes of `hourly`):
#     sbatch --array=1-4%1 experiments/merlin_cpu.sbatch experiments/merlin_cpu4.toml
name = "merlin_cpu4"
jobs = 4
shuffle = true
ranks_per_node = 16
launcher = ["srun", "--mpi=pmix", "--nodes={nodes}", "--ntasks={P}", "--ntasks-per-node=16", "--cpus-per-task=8",
            "--hint=nomultithread", "--cpu-bind=threads"]
env = { OPENBLAS_NUM_THREADS = "8", OMP_NUM_THREADS = "8", OMP_WAIT_POLICY = "passive" }

[defaults]
n = 16384
d = 8192
warmup = 3
reps = 20
max_reps = 50
ci_target = 0.05
timeline = true

[[run]]
alg = ["ring", "2d", "3d"]
P = [16, 32, 64, 128]

[[run]]
alg = "split"
P = [16, 32]
T = [1, 4]

[[run]]
alg = "split"
P = [64, 128]
T = [1, 2, 4, 8]

[[run]]
alg = "split"
P = [64, 128]
blocks = ["1,3,3,1", "1,2,2,2,1", "1,2,2,2,2,2,2,2,1"]
