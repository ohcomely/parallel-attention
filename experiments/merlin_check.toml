# Merlin7 CPU correctness at the merlin_cpu shape: every algorithm against the fp64 reference, one repetition.
# Kept apart from merlin_cpu so check runs do not mix with timing rows.
#     sbatch experiments/merlin_cpu.sbatch experiments/merlin_check.toml
name = "merlin_check"
launcher = ["srun", "--mpi=pmix", "--ntasks={P}", "--cpus-per-task=8", "--hint=nomultithread", "--cpu-bind=cores"]
env = { OPENBLAS_NUM_THREADS = "8", OMP_NUM_THREADS = "8" }

[defaults]
n = 16384
d = 8192
warmup = 0
reps = 1
max_reps = 1
check = true

[[run]]
alg = ["ring", "2d", "3d"]
P = [16, 128]

[[run]]
alg = "split"
P = [16, 128]
T = [1, 4]

[[run]]  # d1 != d2
alg = ["2d", "3d"]
P = 128
d2 = 2048
