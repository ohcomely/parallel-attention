# E2, time breakdown (Figure 2): one P per regime at n = 32768, d = 16384: P = 4 (2D), 32 (3D), 128 (Split).
# TODO: Split T values should be 1, T*, 4T* once T* is known (placeholder 1, 4, 16).
name = "e2_breakdown"
jobs = 2
shuffle = true

[defaults]
n = 32768
d = 16384
warmup = 5
reps = 20
max_reps = 100
timeline = true

[[run]]
alg = ["ring", "2d", "3d", "split"]
P = [4, 32]

[[run]]
alg = ["ring", "2d", "3d"]
P = 128

[[run]]
alg = "split"
P = 128
T = [1, 4, 16]
